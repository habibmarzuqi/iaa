# ============================================
# IAA Digital - Nginx Config
# ============================================
# Untuk domain: iaa.monas.web.id
# Letakkan file ini sebagai /etc/nginx/conf.d/default.conf
# atau gunakan dengan docker-compose

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name iaa.monas.web.id www.iaa.monas.web.id;

    # Untuk Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect semua ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name iaa.monas.web.id www.iaa.monas.web.id;

    # SSL Certificate (Let's Encrypt)
    # Ganti path sesuai lokasi certbot
    ssl_certificate /etc/letsencrypt/live/iaa.monas.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iaa.monas.web.id/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Next.js Application
    location / {
        proxy_pass http://app:3000;
        # Jika tanpa Docker, gunakan:
        # proxy_pass http://localhost:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout untuk upload file besar
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Static uploads (served directly by Nginx untuk performance)
    location /uploads/ {
        alias /var/www/uploads/;
        # Jika tanpa Docker:
        # alias /home/z/my-project/public/uploads/;
        
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # File upload size limit (50MB untuk arsip)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location /_next/static/ {
        proxy_pass http://app:3000;
        # Jika tanpa Docker: proxy_pass http://localhost:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Disable access to sensitive files
    location ~ /\. {
        deny all;
    }
    location ~ /(package\.json|package-lock\.json|tsconfig\.json|\.env) {
        deny all;
    }
}
